name: watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py

      - name: Commit seen.json if changed
        run: |
          git add seen.json
          if git diff --cached --quiet; then
            echo "seen.json unchanged"
            exit 0
          fi
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git commit -m "Update seen listings"
          git push
